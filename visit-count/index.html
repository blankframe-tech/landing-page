<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://blankframe.goatcounter.com">
  <link rel="canonical" href="https://blankframe.goatcounter.com">
  <script>
    window.location.replace('https://blankframe.goatcounter.com' + window.location.search + window.location.hash);
  </script>
  <title>BlankFrame Technologies — Traffic Analytics</title>
  <style>
    :root {
      --bg: #F2F1ED;
      --card: #FFFFFF;
      --ink: #131313;
      --muted: #6F6E6A;
      --line: #E6E4DE;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 44px 36px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 30px -12px rgba(19,19,19,0.10);
    }
    .icon {
      font-size: 42px;
      margin-bottom: 16px;
      display: inline-block;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 10px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 999px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .btn:hover {
      background: #000;
      transform: translateY(-1px);
    }
    .back {
      display: block;
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }
    .back:hover {
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">📊</span>
    <h1>BlankFrame Traffic Breakdown</h1>
    <p>Opening your live analytics breakdown on GoatCounter...</p>
    <a class="btn" href="https://blankframe.goatcounter.com">Open Dashboard &rarr;</a>
    <a class="back" href="/">← Return to BlankFrame.tech</a>
  </div>
</body>
</html>
